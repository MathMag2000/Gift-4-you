spring.application.name=gift-4-you

# Enums trafegam na API pelo código (ex.: AMIGO); as descrições ficam em /api/opcoes.
spring.jackson.datatype.enum.read-enums-using-to-string=false
spring.jackson.datatype.enum.write-enums-using-to-string=false

# Chave e modelo do Gemini lidos de variáveis de ambiente. Nunca escreva a chave neste arquivo.
gemini.chave-api=${GEMINI_API_KEY:}
gemini.modelo=${GEMINI_MODEL:}
