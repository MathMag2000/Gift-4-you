spring.application.name=gift-4-you

# O navegador confere com o servidor, a cada acesso, se os arquivos do site (HTML, CSS, JS) mudaram.
# Sem isso ele pode reaproveitar arquivos de uma versão antiga e misturá-los com os novos, quebrando a página.
# Arquivos que não mudaram respondem 304 (sem baixar de novo), então o site continua rápido.
spring.web.resources.cache.cachecontrol.no-cache=true

# Limites contra abuso (valores padrão abaixo). Podem ser mudados por variáveis de ambiente,
# ex.: GIFT4YOU_LIMITE_IA_POR_HORA=20.
# gift4you.limite.ia-por-hora=10
# gift4you.limite.login-falhas-por-email=5
# gift4you.limite.login-falhas-por-ip=20
# gift4you.limite.cadastros-por-ip-hora=10

# Enums trafegam na API pelo código (ex.: AMIGO); as descrições ficam em /api/opcoes.
spring.jackson.datatype.enum.read-enums-using-to-string=false
spring.jackson.datatype.enum.write-enums-using-to-string=false

# Chave e modelo do Gemini lidos de variáveis de ambiente. Nunca escreva a chave neste arquivo.
gemini.chave-api=${GEMINI_API_KEY:}
gemini.modelo=${GEMINI_MODEL:}

# Intermediário opcional para a busca de produtos na Amazon, que costuma bloquear servidores de hospedagem.
# Endereço do serviço com {url} no lugar da busca, ex.:
# https://api.scraperapi.com/?api_key=SUA_CHAVE&country_code=br&url={url}
# Contém a chave do serviço: defina pela variável de ambiente, nunca neste arquivo.
amazon.intermediario=${AMAZON_PROXY_URL:}

# Banco de dados PostgreSQL. Os valores abaixo são os padrões para um PostgreSQL local; para mudar,
# use as variáveis de ambiente ou o arquivo banco.properties (modelo em banco.properties.exemplo).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gift4you}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Cria as tabelas de schema.sql na inicialização, se ainda não existirem.
spring.sql.init.mode=always

# Sessão do login: o cookie não pode ser lido pelo JavaScript (http-only) e não é enviado em
# pedidos vindos de outros sites (same-site), o que protege contra CSRF.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Arquivos locais ignorados pelo Git, com a chave da IA e a senha do banco (modelos em *.exemplo).
# Se existirem, os valores deles têm prioridade.
spring.config.import=optional:file:./chave-ia.properties,optional:file:./banco.properties
