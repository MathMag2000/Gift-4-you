<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Presente Ideal - Sugestões que conectam</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/estilo.css">
    <script type="module" src="js/app.js"></script>
</head>
<!-- O estado muda para "logado" ou "deslogado" assim que o site consulta a sessão (ver app.js). -->
<body data-estado="verificando">

<!-- Login e criação de conta (ver conta.js) -->
<div id="tela-login" class="so-deslogado"></div>

<!-- Site: menu lateral e a tela atual, trocada conforme o endereço #/... (ver app.js) -->
<div class="layout so-logado">
    <aside id="lateral" class="lateral"></aside>
    <main id="principal" class="principal"></main>
</div>

<div id="modal-raiz"></div>
<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
</body>
</html>
