# Configurações do site publicado. Ativadas com SPRING_PROFILES_ACTIVE=producao (o Dockerfile já faz isso).

# Porta: as hospedagens informam a delas na variável PORT. Só vale aqui, para que uma variável PORT
# definida no computador de desenvolvimento não mude a porta 8080.
server.port=${PORT:8080}

# Banco: sem valores padrão. Se alguma variável faltar, o servidor não inicia, em vez de tentar
# o usuário e a senha "postgres".
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O cookie de login só trafega em HTTPS. Por isso o site publicado precisa de HTTPS (as hospedagens
# como Railway e Render já oferecem).
server.servlet.session.cookie.secure=true

# A hospedagem recebe o HTTPS e repassa o pedido ao servidor por um proxy. Isto faz o servidor usar o
# endereço real de quem acessou (para os limites de login) e saber que a conexão original era HTTPS.
server.forward-headers-strategy=native

# Não mostra detalhes internos nas páginas de erro.
server.error.include-stacktrace=never
server.error.include-message=never
